<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Iniciar Sesión</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.css">
<style>
  body {
    background-color:rgb(236, 225, 225);
    font-family: 'Inter', sans-serif;
  }
  .gradient-bg {
    
    background-size: 200% 200%;
    animation: gradientShift 15s ease infinite;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    animation: fadeInUp 0.6s ease-out;
    box-shadow: 2px 2px 20px;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .input-field:focus {
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25);
  }
  .btn-primary {
    background: linear-gradient(130deg, #000000 0%, #5b595c 100%);
    transition: all 0.3s ease;
    color:white;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
  }
  .btn-primary:active {
    transform: translateY(0);
  }
  .shake {
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .loader {
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

  <div class="card w-full max-w-md bg-white rounded-2xl overflow-hidden">
    <!-- Header -->
    <div class="bg-gradient-to-r from-yellow-500 to-red-600 p-8 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 backdrop-blur-sm rounded-full mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">¡Bienvenido de nuevo!</h1>
      <p class="text-white/80 text-sm mt-1">Inicia sesión para continuar</p>
    </div>

    <!-- Form -->
    <form id="loginForm" class="p-8 space-y-5" novalidate>
      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
          Correo electrónico
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          </span>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="tu@correo.com"
            autocomplete="email"
            class="input-field w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 transition"
          />
        </div>
        <p id="emailError" class="text-red-500 text-xs mt-1 hidden">Introduce un correo válido</p>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
          Contraseña
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0-1.104.896-2 2-2s2 .896 2 2m-6 0a6 6 0 1112 0v3h-2v-3a4 4 0 00-8 0v3H6v-3zM5 11h14v9H5v-9z" />
            </svg>
          </span>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            class="input-field w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 transition"
          />
          <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-indigo-500 transition">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <p id="passwordError" class="text-red-500 text-xs mt-1 hidden">La contraseña debe tener al menos 6 caracteres</p>
      </div>

      <!-- Remember + Forgot -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" id="remember" class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500"/>
          <span class="ml-2 text-gray-600">Recordarme</span>
        </label>
        <a href="#" class="text-indigo-600 hover:text-indigo-800 font-medium">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Alert -->
      <div id="alert" class="hidden rounded-lg p-3 text-sm"></div>

      <!-- Submit -->
      <button
        type="submit"
        id="submitBtn"
        class="btn-primary w-full py-3 text-white font-semibold rounded-lg flex items-center justify-center"
      >
        <span id="btnText">Iniciar sesión</span>
        <div id="btnLoader" class="loader ml-2 hidden"></div>
      </button>

      <!-- Register link -->
      <p class="text-center text-sm text-gray-600">
        ¿No tienes cuenta?
        <a href="#" class="text-indigo-600 hover:text-indigo-800 font-semibold">Regístrate aquí</a>
      </p>
    </form>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');
  const togglePassword = document.getElementById('togglePassword');
  const eyeIcon = document.getElementById('eyeIcon');
  const alertBox = document.getElementById('alert');
  const submitBtn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const btnLoader = document.getElementById('btnLoader');

  // Toggle password visibility
  togglePassword.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    eyeIcon.innerHTML = isPassword
      ? '<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />'
      : '<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
  });

  // Validate email format
  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  // Show alert
  function showAlert(message, type) {
    alertBox.className = 'rounded-lg p-3 text-sm ' +
      (type === 'success' ? 'bg-green-100 text-green-700 border border-green-200' : 'bg-red-100 text-red-700 border border-red-200');
    alertBox.textContent = message;
    alertBox.classList.remove('hidden');
  }

  // Real-time validation
  emailInput.addEventListener('input', () => {
    if (emailInput.value && !isValidEmail(emailInput.value)) {
      emailError.classList.remove('hidden');
    } else {
      emailError.classList.add('hidden');
    }
  });

  passwordInput.addEventListener('input', () => {
    if (passwordInput.value && passwordInput.value.length < 6) {
      passwordError.classList.remove('hidden');
    } else {
      passwordError.classList.add('hidden');
    }
  });

  // Submit
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let valid = true;

    if (!isValidEmail(emailInput.value)) {
      emailError.classList.remove('hidden');
      emailInput.parentElement.classList.add('shake');
      setTimeout(() => emailInput.parentElement.classList.remove('shake'), 400);
      valid = false;
    }
    if (passwordInput.value.length < 6) {
      passwordError.classList.remove('hidden');
      passwordInput.parentElement.classList.add('shake');
      setTimeout(() => passwordInput.parentElement.classList.remove('shake'), 400);
      valid = false;
    }

    if (!valid) {
      showAlert('Por favor, corrige los errores del formulario.', 'error');
      return;
    }

    // Simulate loading
    btnText.textContent = 'Iniciando sesión...';
    btnLoader.classList.remove('hidden');
    submitBtn.disabled = true;
    submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
    alertBox.classList.add('hidden');

    setTimeout(() => {
      btnText.textContent = 'Iniciar sesión';
      btnLoader.classList.add('hidden');
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
      showAlert(`¡Bienvenido! Sesión iniciada con ${emailInput.value}`, 'success');
    }, 1500);
  });
</script>
</body>
</html>
